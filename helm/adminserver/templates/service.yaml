apiVersion: v1
kind: Service
metadata:
  name: {{ include "adminserver.fullname" . }}
  labels:
    {{- include "adminserver.labels" . | nindent 4 }}
    spring-boot: "true"
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "adminserver.selectorLabels" . | nindent 4 }}
